<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18+</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: 0;
    position: relative;
    overflow: hidden;
}
.gif-container {
    position: fixed;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    width: 60vw;
    z-index: -1;
}
.gif-container img {
    width: 100%;
}
.arrow {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 50%;
    animation: bounce 2s infinite;
}
@keyframes bounce {
    0%,20%,50%,80%,100% { transform: translateY(0); }
    40%,60% { transform: translateY(-15px); }
}
.default-landing {
    display: none;
    text-align: center;
    margin-top: 40%;
}
.notification {
    background-color: rgba(255,255,255,0.85);
    border-radius: 12px;
    padding: 16px 20px;
    width: 90%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.notification-title {
    font-size: 20px;
    font-weight: bold;
    text-align: left;
    margin-bottom: 8px;
}
.instructions {
    font-size: 17px;
    text-align: left;
    margin-bottom: 6px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const translations = {
        en: {
            title: "You opened this in TikTok. To continue, open it in your browser.",
            step1: "1. Tap the three dots in the top right corner.",
            step2: "2. Select \"Open in browser\"."
        },
        ru: {
            title: "Вы открыли это в TikTok. Чтобы продолжить, откройте в браузере.",
            step1: "1. Нажмите на три точки в правом верхнем углу.",
            step2: "2. Выберите \"Открыть в браузере\"."
        },
        uk: {
            title: "Ви відкрили це в TikTok. Щоб продовжити, відкрийте у браузері.",
            step1: "1. Натисніть на три крапки у верхньому правому куті.",
            step2: "2. Виберіть \"Відкрити у браузері\"."
        },
        es: {
            title: "Abriste esto en TikTok. Para continuar, ábrelo en el navegador.",
            step1: "1. Toca los tres puntos en la esquina superior derecha.",
            step2: "2. Selecciona \"Abrir en el navegador\"."
        },
        pt: {
            title: "Você abriu isso no TikTok. Para continuar, abra no navegador.",
            step1: "1. Toque nos três pontos no canto superior direito.",
            step2: "2. Selecione \"Abrir no navegador\"."
        },
        fr: {
            title: "Vous avez ouvert ceci dans TikTok. Pour continuer, ouvrez-le dans le navigateur.",
            step1: "1. Appuyez sur les trois points en haut à droite.",
            step2: "2. Sélectionnez \"Ouvrir dans le navigateur\"."
        },
        de: {
            title: "Du hast dies in TikTok geöffnet. Öffne es im Browser, um fortzufahren.",
            step1: "1. Tippe auf die drei Punkte oben rechts.",
            step2: "2. Wähle \"Im Browser öffnen\"."
        }
    };

    // Детект языка
    let userLang = navigator.language || navigator.userLanguage;
    userLang = userLang.substring(0,2).toLowerCase();

    const lang = translations[userLang] ? userLang : "en";

    // Вставляем перевод
    document.getElementById("title").innerText = translations[lang].title;
    document.getElementById("step1").innerText = translations[lang].step1;
    document.getElementById("step2").innerText = translations[lang].step2;

    // Детект TikTok / in-app
    const ua = navigator.userAgent || "";
    const isTikTok =
        ua.includes("TikTok") ||
        ua.includes("Bytedance") ||
        ua.includes("musical_ly") ||
        ua.includes("com.zhiliaoapp.musically");

    const isInAppBrowser =
        ua.includes("FBAN") || 
        ua.includes("FBAV") || 
        ua.includes("Instagram") ||
        ua.includes("Line") ||
        ua.includes("wv");

    if (isTikTok || isInAppBrowser) {
        document.querySelector('.default-landing').style.display = "block";
    } else {
        window.location.replace("https://skutya.top/click?o=3&a=7133");
    }

});
</script>

</head>
<body>

<div class="gif-container">
    <img src="https://s4.gifyu.com/images/bLSi6.gif" alt="Background GIF">
</div>

<div class="default-landing">
    <img src="https://cdn.imgpile.com/f/sGTgXj2_xl.png" alt="Arrow" class="arrow">
    <div class="notification">
        <div class="notification-title" id="title"></div>
        <div class="instructions" id="step1"></div>
        <div class="instructions" id="step2"></div>
    </div>
</div>

</body>
</html>
