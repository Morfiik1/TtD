<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --muted: #aaa;
    --accent: #fe2c55;
    --accent2: #25f4ee;
    --step-bg: rgba(255,255,255,0.05);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow: hidden;
    position: relative;
  }

  /* Ambient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 340px; height: 340px;
    background: var(--accent);
    top: -80px; right: -80px;
  }
  .blob-2 {
    width: 280px; height: 280px;
    background: var(--accent2);
    bottom: -60px; left: -60px;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 24px 28px;
    max-width: 400px;
    width: 100%;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  /* TikTok icon SVG inline */
  .tt-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .headline {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 24px;
    color: #fff;
  }
  .headline span {
    color: var(--accent2);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 22px;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--step-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
  }

  .step-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ff6b6b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    margin-top: 1px;
  }

  .step-text {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
  }

  .step-sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Animated dots arrow pointing top-right */
  .arrow-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.04em;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .arrow-icon {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
    animation: bounceUp 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes bounceUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .arrow-icon span {
    display: block;
    width: 6px;
    height: 6px;
    border-right: 2.5px solid var(--accent2);
    border-top: 2.5px solid var(--accent2);
    transform: rotate(-45deg);
  }

  /* Three-dots visual */
  .dots-visual {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 4px 10px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .dots-visual i {
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
  }

  /* Loading screen */
  #redirect-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .redirect-text {
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- TikTok in-app instruction card -->
<div class="card" id="tiktok-card" style="display:none">
  <div class="logo-row">
    <svg class="tt-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="12" fill="#010101"/>
      <path d="M33.5 10c.4 3.4 2.5 5.7 6 6.2v4.2c-2.1-.2-4-.8-5.7-2v8.9c0 11.2-12.2 14.7-17.1 6.7-3.1-5.1-1-14 8.6-14.4v4.4c-5.1.3-6.4 3.5-5 6 1.5 2.5 5.7 3.1 7.9-.3.5-.9.7-1.9.7-3V10h4.6z" fill="white"/>
      <path d="M33.5 10c.4 3.4 2.5 5.7 6 6.2v4.2c-2.1-.2-4-.8-5.7-2v8.9c0 11.2-12.2 14.7-17.1 6.7-3.1-5.1-1-14 8.6-14.4v4.4c-5.1.3-6.4 3.5-5 6 1.5 2.5 5.7 3.1 7.9-.3.5-.9.7-1.9.7-3V10h4.6z" fill="url(#ttgrad)" opacity="0.5"/>
      <defs>
        <linearGradient id="ttgrad" x1="10" y1="10" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#25f4ee"/>
          <stop offset="1" stop-color="#fe2c55"/>
        </linearGradient>
      </defs>
    </svg>
    <span class="logo-text">TikTok Browser</span>
  </div>

  <div class="headline" id="headline">Чтобы продолжить — открой в <span id="browser-word">браузере</span></div>

  <div class="divider"></div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div>
        <div class="step-text" id="step1-text"></div>
        <div class="step-sub" id="step1-sub"></div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>
        <div class="step-text" id="step2-text"></div>
        <div class="step-sub" id="step2-sub"></div>
      </div>
    </div>
  </div>

  <div class="arrow-hint">
    <div class="arrow-icon">
      <span></span><span></span>
    </div>
    <span id="hint-text"></span>
  </div>
</div>

<!-- Redirect loading screen -->
<div id="redirect-screen">
  <div class="spinner"></div>
  <div class="redirect-text" id="redirect-text">Перенаправление...</div>
</div>


<!-- Hidden Google Translate container -->
<div id="gt-container" style="display:none"></div>

<script>
  // Hide Google Translate bar and branding completely
  (function() {
    const style = document.createElement('style');
    style.textContent = [
      '.goog-te-banner-frame{display:none!important}',
      '#goog-gt-tt{display:none!important}',
      '.goog-tooltip{display:none!important}',
      '.goog-text-highlight{background:none!important;box-shadow:none!important}',
      'body{top:0!important}',
      'iframe.goog-te-menu-frame{display:none!important}'
    ].join('');
    document.head.appendChild(style);
  })();

  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'gt-container');
  }

  (function () {
    const ua = navigator.userAgent || '';
    const isInApp =
      /TikTok|BytedanceWebview|Bytedance|musical_ly|musically/i.test(ua) ||
      /Instagram/i.test(ua) ||
      /FBAN|FBAV|FB_IAB|FB4A/i.test(ua) ||
      /Snapchat/i.test(ua);

    if (!isInApp) {
      document.getElementById('redirect-screen').style.display = 'flex';
      window.location.replace("https://serag.top/click?o=2&a=7133");
      return;
    }

    document.getElementById('tiktok-card').style.display = 'block';

    const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (userLang.startsWith('en')) return;

    // Map some edge cases for Google Translate codes
    const langMap = { 'zh-tw': 'zh-TW', 'zh-hk': 'zh-TW', 'zh': 'zh-CN' };
    const gtLang = langMap[userLang] || userLang.split('-')[0];

    // Dynamically load Google Translate
    const script = document.createElement('script');
    script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    script.onload = function () {
      // Poll until the hidden select appears, then trigger translation
      const interval = setInterval(function () {
        const select = document.querySelector('.goog-te-combo');
        if (select) {
          clearInterval(interval);
          select.value = gtLang;
          select.dispatchEvent(new Event('change'));
        }
      }, 100);
      setTimeout(function () { clearInterval(interval); }, 5000);
    };
    document.head.appendChild(script);
  })();
</script>
</body>
</html>
